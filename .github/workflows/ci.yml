name: CI

# Everything that can be proven without a credential is proven here.
#
# The build deliberately runs against placeholder Supabase values: nothing
# in a Next.js build reaches the network, but `src/config/env.ts` validates
# its schema at import time, so the values must be *shaped* correctly.
# No real secret is needed, and none should ever be added to this file.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — types, lint, tests, build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  database:
    name: Database — migrations and SQL assertions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Applies every migration in order, applies them a second time to
      # prove idempotency, then runs the RLS, credit and job-queue
      # assertions in supabase/tests/.
      - name: Migrations and assertions
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: npm run db:verify

  mobile:
    name: Mobile — types and bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: http://localhost:3000
      EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - name: Types
        run: npm run typecheck

      # Metro is the same bundler the native builds use, so a bundle
      # failure here is a bundle failure on device. This needs no Expo
      # account and no EAS project id.
      - name: Bundle
        run: npx expo export --platform web --output-dir .expo-export
